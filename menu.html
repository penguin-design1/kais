<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Kai's Grill House</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <div class="header-left-spacer"></div>
        <div class="header-center-logo">
            <a href="home.html">
                <img src="kailogo.png" alt="Kai's Grill House Logo" class="logo">
            </a>
        </div>
        <div class="header-right">
            <a href="tel:+27511010800" class="phone-number">+27 51 101 0800</a>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-links-container">
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="menu.html" class="active">Menu</a></li>
            <li><a href="reviews.html">Reviews</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="home-content">
        <div class="dark-card" style="text-align: center; padding: 60px;">
            <div class="section-tagline">Our Offerings</div>
            <h2 style="font-family: serif; font-size: 40px; margin-bottom: 20px; color: #fff;">Explore Our Menu</h2>
            <p style="max-width: 600px; margin: 0 auto;">Discover our flame-grilled steaks, signature burgers, and cold drinks crafted for a great time out.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <img src="kaihead.png" alt="Kai Head Footer Logo" class="footer-logo">
        <p>Give us a like, share and follow!</p>
        <div class="social-bubbles">
            <a href="https://www.facebook.com/kaisgrillhouse/" target="_blank" class="social-bubble facebook" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/kaisgrillhouse/" target="_blank" class="social-bubble instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

</body>
</html>
