<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Kai's Grill House</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <div class="header-left">
            <img src="kailogo.png" alt="Kai's Grill House Logo" class="logo">
        </div>
        <div class="header-center">
            <h1>Kai's Grill House</h1>
            <p class="tagline">Where Friends Meat</p>
        </div>
        <div class="header-right">
            <a href="tel:+27511010800" class="phone-number">+27 51 101 0800</a>
        </div>
    </header>

    <!-- Navigation Links -->
    <nav class="nav-links-container">
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="reviews.html" class="active">Reviews</a></li>
        </ul>
    </nav>

    <!-- Main Reviews Content -->
    <main class="home-content">
        <section class="hours-section">
            <h2>What Our Customers Say</h2>
            <p>Here are our latest live reviews directly from our community!</p>
            
            <!-- AUTOMATIC GOOGLE REVIEWS WIDGET CONTAINER -->
            <!-- Note: Sign up for a free tool like Elfsight.com, connect your Google Place ID, and paste their generated script block here. -->
            <div class="automatic-reviews-container" style="margin-top: 30px;">
                <script src="https://static.elfsight.com/platform/platform.js" async></script>
                <div class="elfsight-app-YOUR-WIDGET-ID-HERE"></div>
            </div>

            <div style="margin-top: 40px;">
                <a href="https://search.google.com/local/writereview?placeID=YOUR_GOOGLE_PLACE_ID" target="_blank" style="background: #fddb3b; color: #222; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block;">Leave Us a Review on Google</a>
            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer class="site-footer">
        <img src="kaihead.png" alt="Kai Head Footer Logo" class="footer-logo">
        <p>Give us a like, share and follow!</p>
        <div class="social-bubbles">
            <a href="https://www.facebook.com/kaisgrillhouse/" target="_blank" class="social-bubble facebook" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/kaisgrillhouse/" target="_blank" class="social-bubble instagram" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </footer>

</body>
</html>
